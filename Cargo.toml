[package]
name = "framemoor-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "GPL-3.0-only"
repository = "https://github.com/wzk112/Framemoor"
description = "Verified, resumable media copy core for macOS and Windows"

[[bin]]
name = "framemoor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
unicode-normalization = "0.1"
uuid = { version = "1.18", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = true

[profile.dev.package.framemoor-core]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3


# ARM SHA instructions are runtime detected; unsupported CPUs use the fallback.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }
