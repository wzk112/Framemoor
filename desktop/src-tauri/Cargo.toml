[package]
name = "framemoor-desktop"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "GPL-3.0-only"
repository = "https://github.com/wzk112/Framemoor"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
framemoor-core = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = "debuginfo"

# Keep the development preview responsive while retaining the debug build path.
[profile.dev.package.framemoor-core]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }
