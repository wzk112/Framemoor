name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt
      - uses: actions/cache@v4
        with:
          path: target
          key: core-${{ runner.os }}-${{ runner.arch }}-1.90-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  desktop:
    name: Desktop (macOS)
    runs-on: macos-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt
      - uses: actions/cache@v4
        with:
          path: desktop/src-tauri/target
          key: desktop-${{ runner.os }}-${{ runner.arch }}-1.90-${{ hashFiles('Cargo.lock', 'desktop/src-tauri/Cargo.lock') }}
      - run: npm ci
      - run: npm run build
      - run: python3 scripts/prepare-resources.py
      - name: Test macOS multilingual metadata
        run: FRAMEMOOR_TEST_EXIFTOOL="$PWD/src-tauri/resources/exiftool/exiftool" cargo test --manifest-path ../Cargo.toml --test metadata_encoding --locked -- --include-ignored --nocapture
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: python3 scripts/prepare-notices.py
      - name: Build macOS Release app and DMG
        run: npm run tauri build -- --ci --bundles app,dmg
      - name: Check macOS package
        run: |
          codesign --verify --deep --strict src-tauri/target/release/bundle/macos/*.app
          hdiutil verify src-tauri/target/release/bundle/dmg/*.dmg
      - name: Prepare downloadable DMG and corresponding source
        run: |
          mkdir -p macos-artifacts
          cp src-tauri/target/release/bundle/dmg/*.dmg macos-artifacts/
          git -C .. archive --format=zip --output=desktop/macos-artifacts/Framemoor-source.zip HEAD
          cp -R src-tauri/resources/notices macos-artifacts/notices
          cd macos-artifacts
          shasum -a 256 *.dmg Framemoor-source.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Framemoor-macos-${{ runner.arch }}
          path: desktop/macos-artifacts/
          if-no-files-found: error
          retention-days: 30

  windows-desktop:
    name: Desktop (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt
      - uses: actions/cache/restore@v4
        id: windows-cache
        with:
          path: |
            desktop/src-tauri/target
          key: desktop-windows-x64-1.90-edge-${{ hashFiles('Cargo.lock', 'desktop/src-tauri/Cargo.lock') }}
          restore-keys: desktop-windows-x64-1.90-driver2.1-${{ hashFiles('Cargo.lock', 'desktop/src-tauri/Cargo.lock') }}
      - run: npm ci
      - run: python scripts/prepare-resources.py
      - run: python scripts/prepare-windows-resources.py
      - run: python scripts/prepare-notices.py
      - name: Test Windows Unicode metadata and long paths
        run: |
          $env:FRAMEMOOR_TEST_EXIFTOOL = (Resolve-Path src-tauri/resources/exiftool-win/exiftool.exe).Path
          cargo test --release --manifest-path ../Cargo.toml --test windows_metadata --locked -- --include-ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release --manifest-path ../Cargo.toml --test metadata_encoding --locked -- --include-ignored --nocapture
      - name: Install test drivers
        run: |
          ./scripts/prepare-windows-driver.ps1
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build Windows NSIS installer
        id: windows-build
        run: npm run tauri build -- --bundles nsis --config src-tauri/tauri.windows.conf.json
      - name: Test native desktop backend
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --locked
      - name: Install and test the real Windows application
        run: |
          $installer = (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          if (-not $installer) { throw 'NSIS installer was not produced' }
          python scripts/test-windows-app.py --installer $installer --native-driver $env:FRAMEMOOR_EDGE_DRIVER
      - name: Prepare downloadable installer and corresponding source
        run: |
          New-Item windows-artifacts -ItemType Directory -Force | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe windows-artifacts/
          git -C .. archive --format=zip --output=desktop/windows-artifacts/Framemoor-source.zip HEAD
          Copy-Item src-tauri/resources/notices windows-artifacts/notices -Recurse
          Get-ChildItem windows-artifacts -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content windows-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-test-results
          path: desktop/native-test-results/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/cache/save@v4
        if: always() && steps.windows-build.outcome == 'success' && steps.windows-cache.outputs.cache-hit != 'true'
        with:
          path: |
            desktop/src-tauri/target
          key: ${{ steps.windows-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: Framemoor-windows-x64
          path: desktop/windows-artifacts/
          if-no-files-found: error
          retention-days: 30

  required:
    name: Required checks
    if: always()
    needs: [core, frontend, desktop, windows-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all jobs to pass
        env:
          CORE: ${{ needs.core.result }}
          FRONTEND: ${{ needs.frontend.result }}
          DESKTOP: ${{ needs.desktop.result }}
          WINDOWS_DESKTOP: ${{ needs.windows-desktop.result }}
        run: test "$CORE" = success && test "$FRONTEND" = success && test "$DESKTOP" = success && test "$WINDOWS_DESKTOP" = success
